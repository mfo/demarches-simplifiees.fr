fr:
  logic:
    empty: un membre vide
    empty_operator: un opérateur vide
    is: Est
    is_not: N’est pas
    error_messages:
      not_available: "Un champ cible n’est plus disponible. Il est soit supprimé, soit déplacé en dessous de ce champ."
      unmanaged: "Le champ « %{libelle} » est de type « %{type_champ} » et ne peut pas être utilisé comme champ cible."
      incompatible: "Le champ « %{libelle} » est de type « %{type_champ} ». Il ne peut pas être %{operator} « %{right} »."
      required_number: "« %{operator} » ne s’applique qu’à des nombres."
      required_list: "Lʼopérateur « inclus » ne s’applique qu’au choix simple ou multiple."
      required_include:
        eq: "Lʼopérateur « est » ne s’applique pas au choix multiple. Sélectionnez l’opérateur « contient »."
        not_eq: "Lʼopérateur « n’est pas » ne s’applique pas au choix multiple."
      not_included: "« %{right} » ne fait pas partie de « %{libelle} »."
      empty_options: "Le champ « %{libelle} » n’a aucune option parmi lesquelles choisir."
      contradiction:
        one: "Aucune valeur du champ « %{libelle} » ne vérifie %{comparisons}."
        other: "Aucune valeur du champ « %{libelle} » ne vérifie à la fois %{comparisons}."
      limited:
        one: "Aucune valeur du champ « %{libelle} » ne vérifie %{comparisons} : ses valeurs sont limitées %{limits}."
        other: "Aucune valeur du champ « %{libelle} » ne vérifie à la fois %{comparisons} : ses valeurs sont limitées %{limits}."
      comparison: "« %{comparison} »"
      limits:
        between: "entre « %{min} » et « %{max} »"
        min: "à « %{min} » au minimum"
        max: "à « %{max} » au maximum"
      unreachable: "Cette condition ne peut jamais être vraie : le champ « %{libelle} » n’est pas affiché dans ce cas."
      contradiction_branch:
        one: "Une des branches « Ou » de cette condition ne peut jamais être vraie : aucune valeur du champ « %{libelle} » n’y vérifie %{comparisons}."
        other: "Une des branches « Ou » de cette condition ne peut jamais être vraie : aucune valeur du champ « %{libelle} » n’y vérifie à la fois %{comparisons}."
      limited_branch:
        one: "Une des branches « Ou » de cette condition ne peut jamais être vraie : aucune valeur du champ « %{libelle} » n’y vérifie %{comparisons}, ses valeurs étant limitées %{limits}."
        other: "Une des branches « Ou » de cette condition ne peut jamais être vraie : aucune valeur du champ « %{libelle} » n’y vérifie à la fois %{comparisons}, ses valeurs étant limitées %{limits}."
      unreachable_branch: "Une des branches « Ou » de cette condition ne peut jamais être vraie : le champ « %{libelle} » n’est pas affiché dans ce cas."
    operators:
      'Logic::LessThan': Inférieur à
      'Logic::LessThanEq': Inférieur ou égal à
      'Logic::Eq': Égal à
      'Logic::GreaterThan': Supérieur à
      'Logic::GreaterThanEq': Supérieur ou égal à
      'Logic::And': Et
      'Logic::Or': Ou
      'Logic::NotEq': N’est pas
      'Logic::IncludeOperator': Contient
      'Logic::ExcludeOperator': Ne contient pas
      'Logic::InDepartementOperator': Est dans le département
      'Logic::NotInDepartementOperator': N’est pas dans le département
      'Logic::InRegionOperator': Est dans la région
      'Logic::NotInRegionOperator': N’est pas dans la région
