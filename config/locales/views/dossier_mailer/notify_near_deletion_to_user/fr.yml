fr:
  dossier_mailer:
    notify_near_deletion_to_user:
      subject_termine:
        one: Un dossier traité va bientôt être supprimé
        other: Des dossiers traités vont bientôt être supprimés
      header_termine:
        one: "Afin de respecter la durée de conservation de vos données personnelles, ce dossier traité sera supprimé le %{expiration_date} :"
        other: "Afin de respecter la durée de conservation de vos données personnelles, ces dossiers traités seront supprimés le %{expiration_date} :"
      account_active:
        one: Votre compte reste activé sur %{application_name}, seul le dossier sera supprimé.
        other: Votre compte reste activé sur %{application_name}, seuls les dossiers seront supprimés.
      footer_termine_html:
        one: Vous pouvez télécharger ce dossier au format PDF et retrouver tous vos dossiers expirants sur la page <a href="%{dossiers_url}">mes dossiers</a> en appliquant un filtre par l’alerte « Expire bientôt ».
        other: Vous pouvez télécharger ces dossiers au format PDF et retrouver tous vos dossiers expirants sur la page <a href="%{dossiers_url}">mes dossiers</a> en appliquant un filtre par l’alerte « Expire bientôt ».
