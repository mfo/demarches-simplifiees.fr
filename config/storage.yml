local:
  service: Disk
  root: <%= Rails.root.join("storage") %>
test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>
openstack:
  service: OpenStack
  container: "<%= ENV['FOG_ACTIVESTORAGE_DIRECTORY'] %>"
  credentials:
    openstack_auth_url: "<%= ENV['FOG_OPENSTACK_URL'] %>"
    openstack_api_key: "<%= ENV['FOG_OPENSTACK_API_KEY'] %>"
    openstack_username: "<%= ENV['FOG_OPENSTACK_USERNAME'] %>"
    openstack_region: "<%= ENV['FOG_OPENSTACK_REGION'] %>"
    openstack_temp_url_key: "<%= ENV['FOG_OPENSTACK_TEMP_URL_KEY'] %>"
amazon:
  service: S3
  access_key_id: <%= ENV.fetch("S3_ACCESS_KEY_ID", "") %>
  secret_access_key: <%= ENV.fetch("S3_SECRET_ACCESS_KEY", "") %>
  region: <%= ENV.fetch("S3_REGION", "") %>
  bucket: <%= ENV.fetch("S3_BUCKET", "") %>
<% if ENV["S3_ENDPOINT"].present? %>
  endpoint: <%= ENV["S3_ENDPOINT"] %> # http://localhost:4444/upstream
  # force_path_style change presigned_url
  # true : https://proxy.com/bucket/key
  # false : https://bucket.proxy.com/key
<% end %>
  force_path_style: <%= ENV.fetch("S3_FORCE_PATH_STYLE", "false") %>
