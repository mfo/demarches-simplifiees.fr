name: 'Setup Rails assets'
description: 'Pre-compile and cache the app assets'

runs:
  using: composite
  steps:
    # Engine stylesheets are compiled into application.css (see the require in
    # app/assets/stylesheets/application.scss), and precompile is skipped on a
    # cache hit — so they have to take part in the key, or a change touching
    # only an engine would test against a stale bundle.
    - name: Assets cache
      uses: actions/cache@v4
      id: cache
      with:
        path: |
          public/assets
          public/vite-test
          public/vite
          tmp/cache/vite
        key: asset-cache-${{ runner.os }}-${{ hashFiles('package.json', 'patches/**/*.patch', 'app/javascript/**', 'app/assets/**', 'engines/*/app/assets/**', 'vite.config.ts') }}
        restore-keys: |
          asset-cache-${{ runner.os }}-${{ hashFiles('package.json', 'patches/**/*.patch', 'app/javascript/**', 'app/assets/**', 'engines/*/app/assets/**') }}
          asset-cache-${{ runner.os }}-${{ hashFiles('package.json', 'patches/**/*.patch') }}
          asset-cache-${{ runner.os }}-

    - name: Setup bun and node modules
      uses: ./.github/actions/ci-setup-bun-node
      if: steps.cache.outputs.cache-hit != 'true'

    - name: Precompile assets
      env:
        RAILS_ENV: test
      run: bin/rails assets:precompile --trace
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
